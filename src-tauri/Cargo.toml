[package]
name = "beautiful-dynamo-viewer"
version = "0.1.4"
description = "Desktop tool for exploring DynamoDB single-table designs"
authors = ["Eduar Tech (https://eduar.tech/)"]
license = "MIT"
homepage = "https://eduar.tech/"
repository = "https://github.com/devcastech/beautiful-dynamo-viewer"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "beautiful_dynamo_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

tokio = "1.50.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

aws-config = "1.8.15"
aws-sdk-dynamodb = "1.110.0"
serde_dynamo = { version = "4", features = ["aws-sdk-dynamodb+1"] }
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
